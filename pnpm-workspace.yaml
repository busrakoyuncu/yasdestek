packages:
  - "apps/*"
  - "packages/*"

# install-time build scripts are blocked by default (supply-chain safety);
# each package that needs one must be explicitly allowed here
allowBuilds:
  '@prisma/engines': true
  argon2: true
  prisma: true
  unrs-resolver: true
  vue-demi: true

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.104.5'
  - '@tanstack/vue-query@5.104.5'
