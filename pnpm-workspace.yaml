packages:
  - "apps/*"
  - "packages/*"

# install-time build scripts are blocked by default (supply-chain safety);
# each package that needs one must be explicitly allowed here
allowBuilds:
  '@prisma/engines': true
  argon2: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@testing-library/user-event@14.6.9'
  - i18next@27.1.1
