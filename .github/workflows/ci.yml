name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgresql://yasdestek:yasdestek-dev@localhost:5432/yasdestek
  SEED_ADMIN_USERNAME: admin
  SEED_ADMIN_PASSWORD: change-me
  S3_ENDPOINT: http://localhost:3900
  S3_REGION: garage
  S3_ACCESS_KEY: yasdestek
  S3_SECRET_KEY: yasdestek-dev-secret
  S3_BUCKET: media

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: yasdestek
          POSTGRES_PASSWORD: yasdestek-dev
          POSTGRES_DB: yasdestek
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yasdestek"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Same image and config as docker-compose.yml. A service container
      # cannot take a command, so it is started here instead.
      - name: Start Garage
        run: |
          docker run -d --name garage -p 3900:3900 -p 3903:3903 \
            -v "$PWD/garage.toml:/etc/garage.toml:ro" \
            -e GARAGE_RPC_SECRET="$(openssl rand -hex 32)" \
            -e GARAGE_DEFAULT_ACCESS_KEY=yasdestek \
            -e GARAGE_DEFAULT_SECRET_KEY=yasdestek-dev-secret \
            -e GARAGE_DEFAULT_BUCKET=media \
            dxflrs/garage:v2.4.1 /garage server --single-node --default-bucket
          for i in $(seq 1 30); do
            curl -sf http://localhost:3903/health && break
            sleep 1
          done
          curl -sf http://localhost:3903/health

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
