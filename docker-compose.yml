services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: yasdestek
      POSTGRES_PASSWORD: yasdestek-dev
      POSTGRES_DB: yasdestek
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # S3-compatible object storage for uploaded media. Single node; the default
  # key and bucket are created on first start from the variables below.
  garage:
    image: dxflrs/garage:v2.4.1
    command: /garage server --single-node --default-bucket
    environment:
      # dev-only; production sets a real 64-hex secret in .env
      GARAGE_RPC_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_ACCESS_KEY: yasdestek
      GARAGE_DEFAULT_SECRET_KEY: yasdestek-dev-secret
      GARAGE_DEFAULT_BUCKET: media
    ports:
      - "3900:3900"
      - "3903:3903"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage:/var/lib/garage

# named volumes
volumes:
  pgdata:
  garage:
