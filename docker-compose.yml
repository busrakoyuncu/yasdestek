services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: yasdestek
      POSTGRES_PASSWORD: yasdestek-dev
      POSTGRES_DB: yasdestek
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: yasdestek
      MINIO_ROOT_PASSWORD: yasdestek-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - media:/data

volumes:
  pgdata:
  media:
